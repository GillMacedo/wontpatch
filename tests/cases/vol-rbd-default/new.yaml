apiVersion: batch/v1
kind: Job
metadata:
  name: j@R@
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: c
        image: busybox:1.36
      volumes:
      - name: v
        rbd:
          image: foo
          monitors: ["1.2.3.4:6789"]
          pool: rbd
          user: admin
          keyring: /etc/ceph/keyring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tail
